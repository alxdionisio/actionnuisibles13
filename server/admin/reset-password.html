<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — Action Nuisibles 13</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.12); padding: 48px 40px; width: 100%; max-width: 400px; }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 1.3rem; color: #1a6b3c; font-weight: 700; }
  .logo p { font-size: .85rem; color: #666; margin-top: 4px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: .95rem; outline: none; transition: border-color .2s; }
  input:focus { border-color: #1a6b3c; }
  .field { margin-bottom: 18px; }
  button[type=submit] { width: 100%; padding: 12px; background: #1a6b3c; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 8px; }
  button[type=submit]:hover { background: #145530; }
  button[type=submit]:disabled { opacity: .6; cursor: not-allowed; }
  .info { background: #ecfdf5; color: #065f46; border-radius: 8px; padding: 12px 14px; font-size: .875rem; margin-bottom: 16px; display: none; line-height: 1.4; }
  .error { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 14px; font-size: .875rem; margin-bottom: 16px; display: none; }
  .help { font-size: .78rem; color: #6b7280; margin-top: 6px; line-height: 1.4; }
  .strength { font-size: .75rem; font-weight: 600; margin-top: 6px; }
  .strength.weak { color: #b91c1c; }
  .strength.ok { color: #b45309; }
  .strength.strong { color: #047857; }
  .back { text-align: center; margin-top: 20px; font-size: .85rem; }
  .back a { color: #1a6b3c; text-decoration: none; font-weight: 500; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un mot de passe robuste</p>
  </div>
  <div class="info" id="info"></div>
  <div class="error" id="err"></div>
  <form id="resetForm">
    <div class="field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required autofocus>
      <p class="help">Minimum 10 caractères. Mélangez lettres, chiffres et symboles.</p>
      <div class="strength" id="strength"></div>
    </div>
    <div class="field">
      <label for="password2">Confirmer le mot de passe</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="10" required>
    </div>
    <button type="submit" id="btn">Réinitialiser</button>
  </form>
  <div class="back"><a href="/">← Retour à la connexion</a></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const err = document.getElementById('err');
const info = document.getElementById('info');

if (!token) {
  err.textContent = 'Lien de réinitialisation invalide ou incomplet.';
  err.style.display = 'block';
  document.getElementById('btn').disabled = true;
}

const pwd = document.getElementById('password');
const strengthEl = document.getElementById('strength');
pwd.addEventListener('input', () => {
  const v = pwd.value;
  let score = 0;
  if (v.length >= 10) score++;
  if (v.length >= 14) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  if (!v) { strengthEl.textContent = ''; strengthEl.className = 'strength'; return; }
  if (score <= 2) { strengthEl.textContent = 'Faible'; strengthEl.className = 'strength weak'; }
  else if (score <= 3) { strengthEl.textContent = 'Acceptable'; strengthEl.className = 'strength ok'; }
  else { strengthEl.textContent = 'Robuste'; strengthEl.className = 'strength strong'; }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  info.style.display = 'none';
  const password = pwd.value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) {
    err.textContent = 'Les mots de passe ne correspondent pas.';
    err.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Réinitialisation…';
  try {
    const res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    info.textContent = (data.message || 'Mot de passe réinitialisé.') + ' Redirection vers la connexion…';
    info.style.display = 'block';
    setTimeout(() => { window.location.href = '/'; }, 1500);
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Réinitialiser';
  }
});
</script>
</body>
</html>
