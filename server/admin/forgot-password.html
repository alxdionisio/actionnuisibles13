<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Action Nuisibles 13</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.12); padding: 48px 40px; width: 100%; max-width: 380px; }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 1.3rem; color: #1a6b3c; font-weight: 700; }
  .logo p { font-size: .85rem; color: #666; margin-top: 4px; }
  label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: .95rem; outline: none; transition: border-color .2s; }
  input:focus { border-color: #1a6b3c; }
  .field { margin-bottom: 20px; }
  button[type=submit] { width: 100%; padding: 12px; background: #1a6b3c; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 8px; }
  button[type=submit]:hover { background: #145530; }
  button[type=submit]:disabled { opacity: .6; cursor: not-allowed; }
  .info { background: #ecfdf5; color: #065f46; border-radius: 8px; padding: 12px 14px; font-size: .875rem; margin-bottom: 16px; display: none; line-height: 1.4; }
  .error { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 14px; font-size: .875rem; margin-bottom: 16px; display: none; }
  .help { font-size: .8rem; color: #6b7280; margin-top: 8px; line-height: 1.4; }
  .back { text-align: center; margin-top: 20px; font-size: .85rem; }
  .back a { color: #1a6b3c; text-decoration: none; font-weight: 500; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Mot de passe oublié</h1>
    <p>Réinitialisation du compte admin</p>
  </div>
  <div class="info" id="info"></div>
  <div class="error" id="err"></div>
  <form id="forgotForm">
    <div class="field">
      <label for="identifier">Identifiant ou email</label>
      <input type="text" id="identifier" name="identifier" autocomplete="username" required autofocus>
      <p class="help">Vous recevrez un lien de réinitialisation valable 1 heure.</p>
    </div>
    <button type="submit" id="btn">Envoyer le lien</button>
  </form>
  <div class="back"><a href="/">← Retour à la connexion</a></div>
</div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const info = document.getElementById('info');
  const err = document.getElementById('err');
  btn.disabled = true;
  btn.textContent = 'Envoi…';
  info.style.display = 'none';
  err.style.display = 'none';
  try {
    const res = await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: document.getElementById('identifier').value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    info.textContent = data.message || 'Si un compte correspond, un email de réinitialisation a été envoyé.';
    info.style.display = 'block';
    btn.textContent = 'Lien envoyé ✓';
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Envoyer le lien';
  }
});
</script>
</body>
</html>
