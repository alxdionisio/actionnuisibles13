# Déploiement du site sur GitHub Pages à chaque push sur main
# Réglages requis : Settings → Pages → Source = "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vite doit utiliser la même base que l’URL publique : avec domaine perso (fichier public/CNAME),
      # le site est à la racine « / ». Sans CNAME, GitHub Pages sert souvent https://<user>.github.io/<repo>/.
      - name: Résoudre VITE_BASE_PATH
        id: vite_base
        run: |
          VAR_PATH="${{ vars.VITE_BASE_PATH }}"
          VAR_URL="${{ vars.VITE_BASE_URL }}"
          if [ -n "$VAR_PATH" ]; then
            echo "value=$VAR_PATH" >> "$GITHUB_OUTPUT"
          elif [ -n "$VAR_URL" ]; then
            echo "value=$VAR_URL" >> "$GITHUB_OUTPUT"
          elif [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (sitemap + vite + prerender)
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.vite_base.outputs.value }}

      - name: SPA 404 fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
