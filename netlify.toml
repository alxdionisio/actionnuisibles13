[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://www.google-analytics.com; connect-src 'self' https://formspree.io https://www.google-analytics.com; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'"

# Cache long pour les assets buildés (hashés) et les images
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.webp"
  [headers.values]
  Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/nuisibles/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000"

# SPA : les requêtes qui ne correspondent pas à un fichier (ex. /contact) renvoient index.html.
# Les fichiers statiques (/, /assets/*, /*.png, etc.) sont servis en priorité par Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
